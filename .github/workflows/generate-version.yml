name: Generate Version

on:
  push:
      branches: [main]

      jobs:
        generate-version:
            runs-on: ubuntu-latest

                    steps:
                          - name: Checkout code
                                  uses: actions/checkout@v4
                                          with:
                                                    token: ${{ secrets.GITHUB_TOKEN }}

                                                                - name: Generate version file
                                                                        run: |
                                                                                  COMMIT_HASH=$(git rev-parse --short HEAD)
                                                                                            COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y%m%d%H%M%S')
                                                                                                      VERSION="1.3.0"
                                                                                                                BUILD_ID="${COMMIT_DATE}-${COMMIT_HASH}"
                                                                                                                          
                                                                                                                                    cat > lib/version.generated.ts << EOF
                                                                                                                                              // Auto-generated by GitHub Actions - DO NOT EDIT MANUALLY
                                                                                                                                                        // Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
                                                                                                                                                                  // Commit: ${COMMIT_HASH}
                                                                                                                                                                            
                                                                                                                                                                                      export const AUTO_VERSION = {
                                                                                                                                                                                                  version: "${VERSION}",
                                                                                                                                                                                                              build: "${BUILD_ID}",
                                                                                                                                                                                                                          commitHash: "${COMMIT_HASH}",
                                                                                                                                                                                                                                      generatedAt: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                          EOF
                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                              echo "Generated version: ${VERSION} (${BUILD_ID})"
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                          - name: Commit and push version file
                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                            git config --local user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                                      git config --local user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                                                                git add lib/version.generated.ts
                                                                                                                                                                                                                                                                                                                                          git diff --staged --quiet || git commit -m "chore: auto-generate version [skip ci]"
                                                                                                                                                                                                                                                                                                                                                    git push
